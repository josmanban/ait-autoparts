services:
  autoparts.api:
    build: ./autoparts_api
    image: autoparts.api:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=autoparts.db
      - DATABASE_USER=root
      - DATABASE_PASSWORD=password
      - DATABASE_NAME=autoparts
    depends_on:
      - autoparts.db
    networks:
      - autoparts-network
  autoparts.db:
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=autoparts
    ports:
      - "3306:3306"
    networks:
      - autoparts-network
  autoparts.client:
    build: 
      context: ./autoparts-client
      args:
        NEXT_PUBLIC_API_URL: http://autoparts.api:8000
    image: autoparts.client:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://autoparts.api:8000
    depends_on:
      - autoparts.api
    networks:
      - autoparts-network
networks:
  autoparts-network:
    driver: bridge